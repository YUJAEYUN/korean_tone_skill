hypothesis: >
  round4와 같은 가설(fl-008): "한 문장에 하나의 정보" 규칙이 genre-rules.md에만 있고 SKILL.md
  3단계가 "문장 길이 리듬"이라고만 요약해, 실행 모델이 다절 문장을 나누지 않는다.
  round4는 새 validation 원문에 대상 문장이 거의 없어 이 가설을 시험하지 못했다. 이번
  라운드는 같은 패치(round4 challenger.diff와 동일)를 대상 문장이 있는 원문에서 다시 시험한다.
research_basis: round4 experiment.yaml과 같다.
selection_rule_preregistered: >
  원문을 보기 전에 정한 선별 기준. haiku가 무유도로 쓴 정보글·실용문 후보 중
  scripts/text_metrics.py의 connective_count 기준 연결어미 3개 이상이면서 18어절 이상인
  문장이 하나 이상 있는 글만 ai_heavy 사례로 채택한다. 조건을 만족하는 글이 7편을 넘으면
  생성 순서대로 앞의 7편만 쓴다. 에세이 2편과 자연스러운 글 1편은 회귀 확인용으로 선별 없이
  넣는다(나누기를 강제하지 않는지 보려는 것).
proposed_change: round4 challenger.diff와 동일(SKILL.md 3단계 3번에 문단 추가).
expected_effect: >
  ai_heavy 사례의 다절 문장 수·최대 문장 길이가 champion보다 줄고 블라인드 쌍대 평가에서
  challenger가 이긴다.
regression_risk: round4와 같다(관계 왜곡, 뚝뚝 끊기는 글, 에세이 과잉 분할).
files_allowed:
  - skills/korean-plain-writer/SKILL.md
stop_condition: >
  이번에도 champion·challenger 차이가 반복 실행 편차 수준이면 이 패치 문구로는 중단하고,
  사람 채점으로 "나누는 게 더 나은가"라는 전제부터 확인한다. 의미 게이트 실패 1건 이상
  또는 에세이 장르 승률 0.40 미만이면 승격하지 않는다.
