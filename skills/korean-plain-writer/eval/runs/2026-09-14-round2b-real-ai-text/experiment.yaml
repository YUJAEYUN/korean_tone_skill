hypothesis: >
  라운드 2("2026-09-14-round2-corpus-correction")의 가설은 그대로 유효하다: vendor
  카탈로그의 "~에 대해"/"~를 통해"/"~것이다" 세 패턴이 낮은 빈도(1~2회)에서도 계속
  AI체 신호로 다뤄지면, 사람이 실제로 더 자주 쓰는 자연스러운 표현을 스킬이 지운다.
  이번 라운드는 그 가설 자체가 아니라 **라운드 2의 측정 방법**을 고친다.
research_basis: >
  라운드 2와 동일 (im-not-ai 코퍼스 실측, `2026-09-14-round2-corpus-correction/
  experiment.yaml` 참고). 추가로 이번 라운드는 사용자 피드백을 반영한다: "AI티가
  많이 나는 글을 가지고, 패턴을 손으로 지어내지 말고 실제 글에서 관측해서 개선해야
  하는 것 아니냐"는 지적을 받아, 손으로 쓴 최소쌍(minimal pair) 대신 (1) 실제 여러
  모델이 생성한 텍스트에서 세 패턴이 자연스럽게 나오는 대목을 찾고, (2) champion과
  challenger 모두 korean-plain-writer의 전체 절차(SKILL.md 1~5단계)를 실제로
  수행시켜(제가 손으로 예문을 쓰지 않음) 그 출력을 비교하는 방식으로 바꿨다.
proposed_change: >
  라운드 2와 동일한 diff(`../2026-09-14-round2-corpus-correction/challenger.diff`,
  `references/ai-tell-catalog.md`에 "실측 기반 주의사항" 절 추가)를 그대로 재검증한다.
  이번 라운드에서 diff 자체를 바꾸지는 않았다 — 측정 방법만 바꿨다.
evidence_cases:
  - val4-forecast-01
expected_effect: >
  challenger가 저빈도 "것이다" 종결을 champion보다 더 많이 보존할 것으로 예상. (사전
  탐색 결과 "를 통해"는 champion·challenger 둘 다 "그 덕분에"로 자연스럽게 바꿔 써서
  이번 사례로는 검증되지 않았고, "에 대해"의 동사 결합형은 5차례의 무유도 생성
  시도에서 한 번도 자연스럽게 나오지 않아 이번에도 실측 근거를 확보하지 못했다 —
  아래 "측정 과정에서 발견한 것" 참고.)
regression_risk: 라운드 2와 동일.
files_allowed:
  - skills/korean-plain-writer/references/ai-tell-catalog.md
stop_condition: >
  라운드 2와 동일. 이번 라운드는 diff를 바꾸지 않으므로 표본을 늘려 같은 결론이
  재현되는지, 또는 다른 방향으로 뒤집히는지가 다음 단계 판단 근거가 된다.

측정_과정_기록: >
  Agent 툴로 opus/haiku 모델에게 "다음 주제로 짧은 글을 써 주세요"라는 무유도
  프롬프트(AI티 회피 지시 없음)로 5개 짧은 글을 생성시켜 세 패턴의 실제 등장을
  관찰했다.
  - opus 생성 4건(보도 기사 2건, 경기 전망 1건, 공청회 요약 1건): 세 패턴 모두
    0회. 오히려 상당히 자연스러운 구어체에 가까운 문장으로 나옴("버텨 주는 동안",
    "숨통이야 트이겠지만" 등).
  - haiku 생성 2건: "정책 도입 영향" 글에서 "를 통해" 1회 + "것입니다"(것이다의
    존댓말형) 2회 관측. "소비자 선호 변화" 분석 글에서 "~에 대한"(관형형, "~에
    대해"와는 다른 표면형) 2회 관측 — 이건 이번 라운드에서 케이스로 쓰지 않았다
    (패턴 25가 실측한 것은 "~에 대해(서)"이지 "~에 대한"이 아니라서, 섞어 쓰면
    다른 걸 측정하는 셈이 된다).
  이 haiku "정책 도입" 글(val4-forecast-01)을 champion·challenger 두 조건으로
  실제 스킬 절차를 시뮬레이션시켰다(같은 모델=opus, 같은 입력, 카탈로그 안내문만
  다름). 결과: "를 통해"는 두 조건 모두 "그 덕분에"로 바뀌어 검증 불가, "것이다"는
  champion이 두 번 다 현재형 단정("높아집니다", "가릅니다")으로 바꾸고 challenger는
  두 번 다 "것입니다"를 그대로 뒀다 — 이 라운드가 실제로 검증하는 건 사실상
  "것이다" 패턴 하나뿐이다.
