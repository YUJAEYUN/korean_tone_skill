hypothesis: >
  4단계 의미 보존 체크리스트(8항)가 시제·상(진행/완료)의 변화를 명시적으로 점검하지
  않는다. "쉬운 말로" 다듬는 과정에서 "~하고 있다"류 진행형을 번역투로 오인해 지우면,
  "아직 하는 중"이 "이미 끝난 일"처럼 읽히도록 확신의 강도와는 다른 축에서 의미가
  바뀔 수 있다. plain-vocabulary-map.md의 "~에 위치하고 있다 → ~에 있다" 같은 항목이
  이 축소를 무의식적으로 일반화하도록 유도할 위험이 있다.
evidence_cases:
  - "2026-09-14-champion-vs-naive 파일럿의 val-casual-01(현재는 dev로 강등)에서
     champion이 '충분히 이해하고 있어'(진행 중인 상태)를 '이해했어'(완료)로 바꾼 사례.
     의미 게이트 8항 중 어디에도 걸리지 않아 통과 처리됐지만, 시제·상이 바뀐 것은
     맞다(semantic-scores.jsonl에 경계 사례로 기록)."
proposed_change: >
  SKILL.md 4단계 체크리스트에 9번째 항목을 추가한다: "진행/완료, 현재/과거 등 시제와
  상(相)이 바뀌어 '아직 하는 중'이 '이미 끝난 일'처럼(또는 그 반대로) 읽히지 않는가?
  번역투를 줄이려고 '~하고 있다'를 지울 때 특히 확인하세요." 그 외 규칙, 어휘 매핑표,
  장르 규칙은 건드리지 않는다.
expected_effect: >
  진행상이 핵심 의미인 문장(예: "현재 시범 운영되고 있다", "지금 계속 생각하고 있는
  중이야")에서 champion이 이를 단순 현재/과거형으로 축소하는 실패가 줄어든다. 진행상이
  중요하지 않은 사례(이미 자연스러운 글, 조건문, 인용문 등)에는 아무 영향이 없어야 한다.
regression_risk: >
  체크리스트 항목이 하나 늘면서 불필요하게 "-고 있다"를 그대로 남겨 번역투/중복 표현
  (예: "~하고 있는 중이다")을 못 줄이게 될 위험이 있다. 이번 challenger는 "중복은
  줄이되 진행상 자체는 지우지 말라"고 명시해 이 위험을 낮추려 했다.
files_allowed:
  - skills/korean-plain-writer/SKILL.md
stop_condition: >
  같은 실패(진행상 손실)가 새 검증 사례에서 재현되지 않거나, 두 번의 패치로도 효과가
  없으면 이 가설은 중단하고 다른 가설로 넘어간다.
