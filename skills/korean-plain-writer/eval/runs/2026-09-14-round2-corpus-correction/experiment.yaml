hypothesis: >
  vendor/humanizer 카탈로그의 패턴 25("~에 대해" 남발), 26("~를 통해" 남발), 40("~것이다"
  종결 남발)은 실제 대조 코퍼스 근거 없이 통념(번역투라는 직관)으로 AI체로 분류돼 있다.
  이 세 패턴을 1단계 진단에서 계속 "AI체 신호"로 다루면, 사람이 실제로는 AI보다 더 자주
  쓰는 표현을 스킬이 오히려 지워서 글을 더 AI스럽게(또는 최소한 덜 자연스럽게) 만들
  위험이 있다.
research_basis: >
  외부 프로젝트 im-not-ai(https://github.com/epoko77-ai/im-not-ai)의
  `skills/humanize-korean/references/empirical-validation.md`. 방법론: AI 코퍼스
  60편(Fable5/GPT-5.6-sol/Haiku4.5 3개 모델, 동일 20개 주제, 맨 프롬프트) vs 인간
  코퍼스 60편(2022-01 이전 발행이 Wayback Machine으로 확인된 한겨레·시사IN·KDI·브런치
  등 40개 매체 — ChatGPT 이전이라 AI 혼입 없음). 로그우도비 G² 검정(Dunning 1993).
  "~를 통해"는 추가로 최희경(2016) 코퍼스 인용(비번역 84.4 vs 번역 42.1, 원어민이 2배
  더 씀). 자기 반박 절차(GPT에게 "여전히 AI 티인 이유를 변호하라" 시킨 뒤 데이터를
  못 이기면만 기각)까지 거침. 결과: "~에 대해" 사람 4.39 vs AI 1.46(/1000어절, 사람이
  3배), "~를 통해" 원어민이 2배, "~것이다" 종결 사람 43.0 vs AI 20.4(/1000문장, 사람이
  2배) — 셋 다 통념과 반대 방향.

  **한계**: 이건 제3자 저장소의 자체 보고 결과다. 독립 재현은 하지 않았다. 인간 코퍼스가
  "편집된 전문 산문"이라 "평균적인 사람 글"과는 다를 수 있다는 점을 그쪽 문서 스스로도
  한계로 밝혀 뒀다. 그래도 방법론(사전 AI-혼입 차단, 3개 모델, 통계 검정, 자기반박
  절차)이 우리 기존 vendor 카탈로그(직관적 판단, 통계 검정 없음)보다 구체적이고 확인
  가능해서 이번 라운드의 근거로 채택한다.
evidence_cases: []
proposed_change: >
  `references/ai-tell-catalog.md`에 "실측 기반 주의사항" 절을 추가해 세 패턴(25·26·40)의
  낮은 빈도 사용을 AI체 신호로 보고하거나 이유 없이 고치지 않도록 명시한다. vendor 파일
  자체는 손대지 않는다(PROVENANCE.md 규칙). 다른 패턴이나 규칙은 건드리지 않는다.
expected_effect: >
  자연스럽게 1~2회 쓰인 "에 대해"/"를 통해"/"것이다"를 champion이 불필요하게 고치는
  사례에서 challenger는 그대로 둔다.
regression_risk: >
  이 세 패턴이 진짜 3회 이상 밀집돼 실제 번역투인 경우까지 못 잡을 위험. 그래서 "낮은
  빈도"라는 조건을 명시하고, vendor의 기존 3회+ 임계값 로직 자체는 그대로 둔다(그 로직은
  이미 im-not-ai의 결론과 크게 다르지 않다 — 문제는 임계값이 아니라 "1회부터 의심하는
  태도"였다).
files_allowed:
  - skills/korean-plain-writer/references/ai-tell-catalog.md
stop_condition: >
  같은 실패(불필요한 삭제)가 재현되지 않거나 두 번의 패치로도 효과가 없으면 중단.
